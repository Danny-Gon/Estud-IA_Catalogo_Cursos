<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curso · Estud-IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<a class="salto" href="#contenido">Saltar al contenido</a>

<header class="cabecera cabecera-curso">
  <div class="contenedor">
    <a class="masthead" href="index.html" aria-label="Estud-IA, ir al inicio">
      <img src="img/estud-ia.png" alt="Estud-IA" width="900" height="166">
    </a>
    <a class="volver" href="index.html" id="volver">Volver</a>
    <div id="cabecera-curso"></div>
  </div>
</header>

<main class="contenedor detalle" id="contenido">
  <p class="estado" id="cargando">Cargando el curso…</p>
  <div id="cuerpo"></div>
</main>

<footer class="pie-sitio">
  <div class="contenedor">
    <div class="pie-marcas">
      <img class="sello" src="img/alcaldia-medellin.png"
           alt="Alcaldía de Medellín · Distrito de Ciencia, Tecnología e Innovación"
           width="420" height="320">
      <p>Estud-IA 2026 · Secretaría de Desarrollo Económico, Distrito Especial de Medellín.</p>
    </div>
  </div>
</footer>

<script src="datos.js"></script>
<script>
(function () {
  'use strict';

  var E = window.EstudIA;
  var $ = function (id) { return document.getElementById(id); };

  var id = new URLSearchParams(window.location.search).get('id');

  /* ---- Secciones ---- */

  function plegable(titulo, contenidoHtml) {
    return '<details class="plegable">' +
             '<summary>' + E.esc(titulo) + E.ICONOS.flecha + '</summary>' +
             '<div class="cuerpo">' + contenidoHtml + '</div>' +
           '</details>';
  }

  function modulo(m, i) {
    var items = (m.contenidos || []).map(function (c) {
      return '<li>' + E.esc(c) + '</li>';
    }).join('');

    // El título ya viene como "M1 - Nombre": se parte para no repetir el código.
    var partes = String(m.titulo || '').split(' - ');
    var codigo = partes.length > 1 ? partes.shift() : 'M' + (i + 1);
    var nombre = partes.join(' - ') || m.titulo || '';

    return '<details class="plegable"' + (i === 0 ? ' open' : '') + '>' +
             '<summary>' +
               '<span class="num">' + E.esc(codigo) + '</span>' +
               '<span>' + E.esc(nombre) + '</span>' +
               E.ICONOS.flecha +
             '</summary>' +
             '<div class="cuerpo">' +
               (items ? '<ul>' + items + '</ul>'
                      : '<p>Contenidos por publicar.</p>') +
             '</div>' +
           '</details>';
  }

  function pintarCurso(c) {
    var info = E.CAPAS[c.capa] || { nombre: 'Capa ' + c.capa };
    var nivel = E.nombreNivel(c.nivel);
    document.title = c.nombre + ' · Estud-IA';

    // El enlace de regreso lleva al catálogo de SU capa, no al inicio.
    var volver = $('volver');
    volver.href = 'capa.html?n=' + c.capa;
    volver.innerHTML = E.ICONOS.atras + 'Capa ' + c.capa + ' · ' + E.esc(info.nombre);

    var ficha = '<span class="dato">' + E.ICONOS.reloj + E.esc(c.duracion) + '</span>';
    if (c.modalidad) {
      ficha += '<span class="dato">' + E.ICONOS.modalidad + E.esc(c.modalidad) + '</span>';
    }

    $('cabecera-curso').innerHTML =
      '<span class="encabezado-tarjeta">' +
        '<span class="chip-cat">' + E.esc(E.nombreLinea(c.categoria)) + '</span>' +
        (nivel ? '<span class="chip-nivel">' + E.esc(nivel) + '</span>' : '') +
      '</span>' +
      '<h1>' + E.esc(c.nombre) + '</h1>' +
      '<div class="ficha">' + ficha + '</div>';

    var html = '';

    html += '<section class="bloque">' +
              '<h2>Descripción</h2>' +
              '<p>' + E.esc(c.descripcion) + '</p>' +
            '</section>';

    var herr = c.herramientas || [];
    if (herr.length) {
      html += '<section class="bloque">' +
                '<h2>Herramientas requeridas</h2>' +
                '<ul class="herramientas">' +
                  herr.map(function (h) { return '<li>' + E.esc(h) + '</li>'; }).join('') +
                '</ul>' +
              '</section>';
    }

    if (c.perfil_entrada) {
      html += plegable('Perfil de entrada', '<p>' + E.esc(c.perfil_entrada) + '</p>');
    }
    if (c.perfil_salida) {
      html += plegable('Perfil de salida', '<p>' + E.esc(c.perfil_salida) + '</p>');
    }

    var mods = c.modulos || [];
    if (mods.length) {
      html += '<h2 class="modulos-titulo">Módulos <span>· ' + mods.length + '</span></h2>' +
              mods.map(modulo).join('');
    }

    html += '<p class="acciones">' +
              '<a class="boton" href="capa.html?n=' + c.capa + '">' +
                E.ICONOS.atras + 'Ver los demás cursos de Capa ' + c.capa + '</a>' +
              '<a class="boton secundario" href="index.html">Inicio</a>' +
            '</p>';

    $('cuerpo').innerHTML = html;
  }

  function noEncontrado(id) {
    document.title = 'Curso no encontrado · Estud-IA';
    $('volver').innerHTML = E.ICONOS.atras + 'Volver al inicio';
    $('cabecera-curso').innerHTML = '<h1>Curso no encontrado</h1>';
    $('cuerpo').innerHTML =
      '<div class="estado">' +
        '<h2>No existe un curso con ese identificador</h2>' +
        (id ? '<p>Se buscó <code>' + E.esc(id) + '</code> y no está en el catálogo.</p>'
            : '<p>La dirección no incluye el parámetro <code>?id=</code>.</p>') +
      '</div>' +
      '<p class="acciones">' +
        '<a class="boton" href="capa.html?n=1">Cursos de Capa 1</a>' +
        '<a class="boton secundario" href="capa.html?n=2">Cursos de Capa 2</a>' +
      '</p>';
  }

  function fallo(mensaje) {
    $('cabecera-curso').innerHTML = '<h1>No se pudo cargar el curso</h1>';
    $('cuerpo').innerHTML =
      '<div class="estado"><p>' + E.esc(mensaje) + '</p></div>' +
      '<p class="acciones"><a class="boton" href="index.html">Volver al inicio</a></p>';
  }

  /* ---- Arranque ---- */

  $('volver').innerHTML = E.ICONOS.atras + 'Volver';

  E.cargarCursos().then(function (doc) {
    $('cargando').classList.add('oculto');

    var lista = (doc && doc.cursos) || [];
    var curso = null;
    for (var i = 0; i < lista.length; i++) {
      if (lista[i].id === id) { curso = lista[i]; break; }
    }

    if (curso) { pintarCurso(curso); }
    else { noEncontrado(id); }
  }).catch(function (err) {
    $('cargando').classList.add('oculto');
    fallo(err.message);
  });

})();
</script>

</body>
</html>
